<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" data-pptx-page-role="content">
  <!-- Background Canvas -->
  <rect id="bg_canvas" data-pptx-role="background" x="0" y="0" width="1920" height="1080" fill="#FAFAFA" />

  <!-- Structural Decorations -->
  <rect id="decor_accent_bar" data-pptx-role="decoration" x="100" y="56" width="6" height="48" fill="#2563EB" rx="3" />
  <line id="decor_divider_top" data-pptx-role="decoration" x1="100" y1="190" x2="1820" y2="190" stroke="#E4E4E7" stroke-width="1.5" />

  <!-- Header Module -->
  <g id="header_p06" data-pptx-bounds="100 60 1720 130">
    <text x="124" y="96" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#18181B">核心性能飞跃：两餐 DP 消除重复扫描</text>
    <text x="124" y="146" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="24" fill="#71717A">消除状态重复扫描 · PC/Node 中位数从 23.46 秒降至 71.00 ms (降幅 99.7%) · 逻辑严格等价</text>
    <rect x="1700" y="66" width="120" height="38" rx="8" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <text x="1760" y="92" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#71717A" text-anchor="middle">06 / 09</text>
  </g>

  <!-- Left Column: KPI 看板与可视化对比 -->
  <g id="left_kpi_column_p06" data-pptx-bounds="100 220 820 780">
    <rect x="100" y="220" width="820" height="780" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

    <!-- Card 1: 优化前 -->
    <rect x="136" y="256" width="748" height="200" rx="14" fill="#F4F4F5" />
    <text x="172" y="298" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">旧版 WASM 核心（重复状态扫描）</text>
    <text x="172" y="366" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#F59E0B">23,455.86 <tspan font-size="22" fill="#71717A">ms (约 23.46 s)</tspan></text>
    <rect x="172" y="396" width="676" height="12" rx="6" fill="#E4E4E7" />
    <rect x="172" y="396" width="676" height="12" rx="6" fill="#F59E0B" />
    <text x="172" y="434" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="16" fill="#71717A">耗时极高，存在跨餐次笛卡尔积冗余扫描，界面严重阻塞卡顿</text>

    <!-- Card 2: 优化后 -->
    <rect x="136" y="480" width="748" height="200" rx="14" fill="#2563EB" fill-opacity="0.04" stroke="#2563EB" stroke-width="1.5" />
    <text x="172" y="522" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" font-weight="bold" fill="#2563EB">新核心 T04A19 / user-v5（消除重复扫描）</text>
    <text x="172" y="590" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="42" font-weight="bold" fill="#10B981">70.999 <tspan font-size="22" fill="#71717A">ms (P01 独立复测 86.30 ms)</tspan></text>
    <rect x="172" y="620" width="676" height="12" rx="6" fill="#E4E4E7" />
    <rect x="172" y="620" width="18" height="12" rx="6" fill="#10B981" />
    <text x="172" y="658" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="16" fill="#10B981">耗时锐减 99.7%，进入亚百毫秒级交互体验区间</text>

    <!-- Highlight Banner -->
    <rect x="136" y="704" width="748" height="260" rx="14" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-width="1.5" />
    <text x="172" y="748" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#10B981">百倍加速比 · 消除等待感</text>
    <text x="172" y="792" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#18181B">从 23.46 秒缩减到 71 毫秒，计算性能提升高达 <tspan font-weight="bold" fill="#2563EB">330 倍</tspan>；<tspan x="172" dy="28">彻底解决了两餐 DP 状态空间扩展时的严重停滞问题，</tspan><tspan x="172" dy="28">使高阶动态规划在弱算力客户端具备了真正的日常实用性。</tspan><tspan x="172" dy="28">注：所有耗时均为 PC/Node 统一环境实测中位数。</tspan></text>
  </g>

  <!-- Right Column: 多轮复测数据与机理解析 -->
  <g id="right_data_column_p06" data-pptx-bounds="960 220 860 780">
    <rect x="960" y="220" width="860" height="780" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

    <!-- Table Title -->
    <text x="996" y="268" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="#18181B">G2 两餐 DP 五次运行基准复测比对表</text>

    <!-- Data Table Container -->
    <rect x="996" y="296" width="788" height="260" rx="12" fill="#F4F4F5" />
    <!-- Table Header -->
    <rect x="996" y="296" width="788" height="48" rx="12" fill="#E4E4E7" />
    <text x="1020" y="328" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" font-weight="bold" fill="#18181B">测试轮次 / 交付版本</text>
    <text x="1300" y="328" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" font-weight="bold" fill="#18181B">PC/Node 5次中位数</text>
    <text x="1560" y="328" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" font-weight="bold" fill="#18181B">状态 / 响应一致性</text>

    <!-- Row 1 -->
    <text x="1020" y="376" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">旧冻结 WASM (基线)</text>
    <text x="1300" y="376" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#F59E0B">23,455.864 ms</text>
    <text x="1560" y="376" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">基线原始输出</text>
    <line x1="996" y1="398" x2="1784" y2="398" stroke="#E4E4E7" stroke-width="1" />

    <!-- Row 2 -->
    <text x="1020" y="428" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">T04A19 新核心 (作者测)</text>
    <text x="1300" y="428" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#10B981">70.999 ms</text>
    <text x="1560" y="428" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#10B981">哈希完全一致</text>
    <line x1="996" y1="450" x2="1784" y2="450" stroke="#E4E4E7" stroke-width="1" />

    <!-- Row 3 -->
    <text x="1020" y="480" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">P01 独立复测 (验收端)</text>
    <text x="1300" y="480" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#2563EB">86.300 ms</text>
    <text x="1560" y="480" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#10B981">哈希完全一致</text>
    <line x1="996" y1="502" x2="1784" y2="502" stroke="#E4E4E7" stroke-width="1" />

    <!-- Row 4 -->
    <text x="1020" y="534" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">T06i user-v5 (小程序包)</text>
    <text x="1300" y="534" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#10B981">69.534 ms</text>
    <text x="1560" y="534" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#10B981">接入验证一致</text>

    <!-- Optimization Principle Card -->
    <rect x="996" y="580" width="788" height="180" rx="12" fill="#FAFAFA" stroke="#E4E4E7" stroke-width="1" />
    <text x="1026" y="620" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#18181B">优化核心机理：去除重复遍历，严格保真等价</text>
    <text x="1026" y="660" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#71717A">原算法在展开第二餐状态时，对第一餐候选空间进行了冗余的重复循环匹配；<tspan x="1026" dy="28">本次优化重构了状态分层逻辑，采用前向剪枝与缓存复用，彻底消除了</tspan><tspan x="1026" dy="28">重复扫描。由于未改动评分函数与合法性断言，输出结果哈希与基线 100% 吻合。</tspan></text>

    <!-- Bottom Memory Badge -->
    <rect x="996" y="780" width="788" height="184" rx="12" fill="#2563EB" fill-opacity="0.06" stroke="#2563EB" stroke-width="1" />
    <text x="1026" y="822" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#2563EB">内存占用平稳 · 远低于容量安全线</text>
    <text x="1026" y="862" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="18" fill="#18181B">在 G2 极端高压请求下，WASM 线性内存峰值观察为 <tspan font-weight="bold" fill="#2563EB">562 页</tspan>（约 35.1 MB），<tspan x="1026" dy="28">显著低于系统配置的 768 页（48 MB）容量红线，未发生内存溢出或内存泄漏。</tspan><tspan x="1026" dy="28">（注：此为 PC 端 WASM 线性内存观察，非物理手机内存指标）</tspan></text>
  </g>
</svg>
