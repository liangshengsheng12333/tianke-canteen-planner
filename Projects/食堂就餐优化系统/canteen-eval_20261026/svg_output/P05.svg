    <text x="186" y="890" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">配套原生交互 HTML 三算法机制对照演示【点此或点击上方图片全屏打开】</text>
    <text x="186" y="916" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="14" fill="#71717A">支持贪心/DP/BnB 状态树高亮切换与单选走查（跨电脑通用入口：algo-compare.html）：</text>
    <text x="186" y="942" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#2563EB">./algo-compare.html</text>
    <text x="186" y="970" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="13" fill="#F59E0B">注：三种方法使用同一菜单候选与评分规则，搜索策略不同，单次择一运行而非并行投票</text>
