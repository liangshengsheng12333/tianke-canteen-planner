  <g id="right_dof_analysis_p05" data-pptx-bounds="1030 210 790 790">
    <!-- Card 1: 复杂度推导与实测对比表 -->
    <rect x="1030" y="210" width="790" height="320" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="1054" y="230" width="6" height="22" fill="#2563EB" rx="3" />
    <text x="1068" y="248" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#18181B">三大算法时空复杂度推导与实测性能对照矩阵</text>

    <!-- Table Header -->
    <rect x="1054" y="264" width="742" height="32" rx="6" fill="#F4F4F5" />
    <text x="1068" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#3F3F46">求解策略</text>
    <text x="1168" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#3F3F46">理论时间复杂度</text>
    <text x="1328" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#3F3F46">空间复杂度 / 内存</text>
    <text x="1518" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#3F3F46">PC实测延迟</text>
    <text x="1678" y="286" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#3F3F46">数学最优性</text>

    <!-- Row 1: Greedy -->
    <rect x="1054" y="302" width="742" height="60" fill="#FFFFFF" stroke="#F4F4F5" stroke-width="1" />
    <text x="1068" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#2563EB">贪心 (Greedy)</text>
    <text x="1168" y="334" font-family="Consolas, monospace" font-size="14" fill="#18181B">O(M · K log K)</text>
    <text x="1328" y="334" font-family="Consolas, monospace" font-size="14" fill="#18181B">O(K) 局部缓冲区</text>
    <text x="1518" y="334" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#10B981">&lt; 1.0 ms</text>
    <text x="1678" y="334" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#71717A">局部最优 (启发式)</text>

    <!-- Row 2: DP -->
    <rect x="1054" y="366" width="742" height="74" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="1068" y="398" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#8B5CF6">动态规划 (DP)</text>
    <text x="1068" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">20K桶截断优化</text>
    <text x="1168" y="398" font-family="Consolas, monospace" font-size="14" fill="#18181B">O(M · S · K)</text>
    <text x="1168" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">S ≤ 20,000 桶化</text>
    <text x="1328" y="398" font-family="Consolas, monospace" font-size="14" fill="#18181B">562 页 WASM</text>
    <text x="1328" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">实测约 35.1 MB</text>
    <text x="1518" y="398" font-family="Consolas, monospace" font-size="14" font-weight="bold" fill="#2563EB">71.00 ms</text>
    <text x="1518" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#10B981">提速 330 倍 (原23s)</text>
    <text x="1678" y="398" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#18181B">高精度近似解</text>
    <text x="1678" y="420" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">步长内全局最优</text>

    <!-- Row 3: BnB -->
    <rect x="1054" y="444" width="742" height="74" fill="#FFFFFF" stroke="#F4F4F5" stroke-width="1" />
    <text x="1068" y="476" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#10B981">分支限界 (BnB)</text>
    <text x="1068" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">松弛上下界剪枝</text>
    <text x="1168" y="476" font-family="Consolas, monospace" font-size="14" fill="#18181B">最坏 O(K^M)</text>
    <text x="1168" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">剪枝后大幅收敛</text>
    <text x="1328" y="476" font-family="Consolas, monospace" font-size="14" fill="#18181B">O(M) 递归栈深</text>
    <text x="1328" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">栈深度固定为 3</text>
    <text x="1518" y="476" font-family="Consolas, monospace" font-size="14" fill="#18181B">动态剪枝收敛</text>
    <text x="1518" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#71717A">评估节点极大压缩</text>
    <text x="1678" y="476" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#10B981">严格全局最优</text>
    <text x="1678" y="498" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#10B981">数学保真解</text>

    <!-- Card 2: 决策空间多维自由度建模 -->
    <rect x="1030" y="546" width="790" height="220" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="1054" y="566" width="36" height="36" rx="8" fill="#2563EB" fill-opacity="0.1" />
    <text x="1072" y="590" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#2563EB" text-anchor="middle">A</text>
    <text x="1100" y="591" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#18181B">决策空间多维自由度建模与降维机理 (DoF)</text>
    <text x="1054" y="630" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="17" fill="#71717A">• 决策变量维度：餐次组合 M ∈ {1,2,3}，菜品条目候选全集 C = 137 道<tspan x="1054" dy="26">• 原始自由度爆炸：三餐无约束全排列空间达 137³ ≈ 2,571,353 种组合</tspan><tspan x="1054" dy="26">• 多目标超平面投影：通过预算硬边界 (Price ≤ B) 与宏量营养区间双重约束，</tspan><tspan x="1054" dy="26">  将离散解空间大幅投影并收缩至可行域流形内，剔除 99.2% 无效搜索自由度。</tspan></text>

    <!-- Card 3: WASM 线性内存沙箱工程控制 -->
    <rect x="1030" y="780" width="790" height="220" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />
    <rect x="1054" y="800" width="36" height="36" rx="8" fill="#10B981" fill-opacity="0.1" />
    <text x="1072" y="824" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" font-weight="bold" fill="#10B981" text-anchor="middle">B</text>
    <text x="1100" y="825" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" font-weight="bold" fill="#18181B">工程防御：WebAssembly 单线程线性内存沙箱控制</text>
    <text x="1054" y="864" font-family="Microsoft YaHei, Calibri, sans-serif" font-size="17" fill="#71717A">• 候选池硬性截断：候选集上限锁定 K ≤ 256，防止无界内存增长<tspan x="1054" dy="26">• WASM 线性内存控制：系统设定安全容量红线为 768 页（48 MB）</tspan><tspan x="1054" dy="26">• 实测峰值：PC 端 G2 实测峰值仅 562 页（约 35.1 MB），利用率 73.2%</tspan><tspan x="1054" dy="26">  严格保障微信小程序在单线程 WebAssembly 沙箱中平稳运行，零 OOM 崩溃。</tspan></text>
  </g>
