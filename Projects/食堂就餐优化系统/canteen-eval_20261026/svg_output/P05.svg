    <!-- Outer Card Container -->
    <rect x="100" y="210" width="910" height="790" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5" />

    <!-- Top: 4K Algorithm Comparison Image (点击全屏放大) -->
    <rect id="p05_img_bg" x="120" y="226" width="870" height="200" rx="10" fill="#F4F4F5" stroke="#E4E4E7" stroke-width="1" />
    <image id="img_p05_algo" x="120" y="226" width="870" height="200" preserveAspectRatio="xMidYMid meet" href="../images/T10d-01-三算法机制对照-4K-浅色.png" />
    <rect x="130" y="236" width="220" height="24" rx="4" fill="#000000" fill-opacity="0.6" />
    <text x="240" y="253" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">🔍 点击图片全屏放大交互走查</text>

    <!-- Section Title -->
    <rect x="120" y="438" width="6" height="20" fill="#2563EB" rx="3" />
    <text x="134" y="455" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#18181B">底层 C++ 核心算法实现片段（摘自 core/src/planner.cpp 真实源码）</text>

    <!-- Source Column 1: Greedy (x: 120, w: 280, h: 360) -->
    <rect id="p05_code_greedy" x="120" y="468" width="280" height="376" rx="8" fill="#1E1E2E" stroke="#313244" stroke-width="1" />
    <rect x="130" y="478" width="64" height="22" rx="4" fill="#2563EB" />
    <text x="162" y="494" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GREEDY</text>
    <text x="202" y="494" font-family="Consolas, monospace" font-size="12" fill="#A6ADC8">RunGreedyAlgorithm()</text>
    
    <text x="130" y="524" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 1. 单餐边际增益排序 O(NlogN)</text>
    <text x="130" y="548" font-family="Consolas, monospace" font-size="14" fill="#89B4FA">std::sort</text>
    <text x="200" y="548" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(cands.begin(),</text>
    <text x="130" y="572" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  cands.end(), [](a, b) {</text>
    <text x="130" y="596" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  return a.gain &gt; b.gain;</text>
    <text x="130" y="620" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">});</text>
    <text x="130" y="650" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 2. 局部最优单步贪选截断</text>
    <text x="130" y="674" font-family="Consolas, monospace" font-size="14" fill="#CBA6F7">for </text>
    <text x="162" y="674" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(const auto&amp; c : cands) {</text>
    <text x="130" y="698" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  if (cost + c.cost &lt;= cap) {</text>
    <text x="130" y="722" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">    out-&gt;Push(c); break;</text>
    <text x="130" y="746" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  }</text>
    <text x="130" y="770" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">}</text>
    <text x="130" y="802" font-family="Consolas, monospace" font-size="14" fill="#A6E3A1">⚡ 实测耗时 &lt; 1.0 ms</text>
    <text x="130" y="826" font-family="Consolas, monospace" font-size="14" fill="#6C7086">单步决策自由度直接坍缩</text>

    <!-- Source Column 2: DP (x: 415, w: 280, h: 360) -->
    <rect id="p05_code_dp" x="415" y="468" width="280" height="376" rx="8" fill="#1E1E2E" stroke="#313244" stroke-width="1" />
    <rect x="425" y="478" width="64" height="22" rx="4" fill="#8B5CF6" />
    <text x="457" y="494" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DP 20K</text>
    <text x="497" y="494" font-family="Consolas, monospace" font-size="12" fill="#A6ADC8">RunDpAlgorithm()</text>
    
    <text x="425" y="524" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 1. 分层展开消除重复扫描</text>
    <text x="425" y="548" font-family="Consolas, monospace" font-size="14" fill="#CBA6F7">for </text>
    <text x="457" y="548" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(auto&amp; prev : layer) {</text>
    <text x="425" y="572" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  DpState nxt = Step(prev);</text>
    <text x="425" y="596" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  if (!Dominated(nxt))</text>
    <text x="425" y="620" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">    nextLayer.Push(nxt);</text>
    <text x="425" y="644" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">}</text>
    <text x="425" y="674" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 2. 20,000 状态桶化截断</text>
    <text x="425" y="698" font-family="Consolas, monospace" font-size="14" fill="#F38BA8">if </text>
    <text x="448" y="698" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(nextLayer.Size() &gt; 20000)</text>
    <text x="425" y="722" font-family="Consolas, monospace" font-size="14" fill="#89B4FA">  QuantizeBuckets</text>
    <text x="425" y="746" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">    (&amp;nextLayer, 20000);</text>
    <text x="425" y="770" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// step=20kcal/50dg 量子化</text>
    <text x="425" y="802" font-family="Consolas, monospace" font-size="14" fill="#A6E3A1">⚡ 耗时骤降至 71.00 ms</text>
    <text x="425" y="826" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">提速 330 倍 (原 23.46s)</text>

    <!-- Source Column 3: BnB (x: 710, w: 280, h: 360) -->
    <rect id="p05_code_bnb" x="710" y="468" width="280" height="376" rx="8" fill="#1E1E2E" stroke="#313244" stroke-width="1" />
    <rect x="720" y="478" width="64" height="22" rx="4" fill="#10B981" />
    <text x="752" y="494" font-family="Consolas, monospace" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">BnB</text>
    <text x="792" y="494" font-family="Consolas, monospace" font-size="12" fill="#A6ADC8">RecurseBnB()</text>
    
    <text x="720" y="524" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 1. 后缀松弛上界剪枝</text>
    <text x="720" y="548" font-family="Consolas, monospace" font-size="14" fill="#CBA6F7">if </text>
    <text x="744" y="548" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(stage + 1 &lt; totalMeals) {</text>
    <text x="720" y="572" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">  bool prune = CanPrune(</text>
    <text x="720" y="596" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">    best, nxt, suffix[s+1]);</text>
    <text x="720" y="620" font-family="Consolas, monospace" font-size="14" fill="#F38BA8">  if </text>
    <text x="744" y="620" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(prune) </text>
    <text x="798" y="620" font-family="Consolas, monospace" font-size="14" fill="#F38BA8">continue;</text>
    <text x="720" y="644" font-family="Consolas, monospace" font-size="14" fill="#6C7086">  // 动态剪除整棵劣解树</text>
    <text x="720" y="668" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">}</text>
    <text x="720" y="698" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 2. 递归推进保真最优解</text>
    <text x="720" y="722" font-family="Consolas, monospace" font-size="14" fill="#89B4FA">RecurseBnB</text>
    <text x="796" y="722" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">(env, s + 1);</text>
    <text x="720" y="746" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 栈深度固定=3餐</text>
    <text x="720" y="770" font-family="Consolas, monospace" font-size="14" fill="#6C7086">// 杜绝搜索树指数发散</text>
    <text x="720" y="802" font-family="Consolas, monospace" font-size="14" fill="#A6E3A1">⚡ 全局最优严格保真</text>
    <text x="720" y="826" font-family="Consolas, monospace" font-size="14" fill="#CDD6F4">数学证明绝对最优解</text>

