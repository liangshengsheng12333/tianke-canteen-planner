<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <!-- Background -->
  <rect width="1280" height="720" fill="#F6F9F6" />
  
  <!-- Header Bar -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="90" height="24" rx="4" fill="#E8F1EB" />
    <text x="12" y="17" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1B4D3E">产品闭环</text>
    <text x="105" y="20" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="28" font-weight="bold" fill="#1B4D3E">四步产品使用闭环：从计划推荐到真实记账</text>
    <text x="0" y="48" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#5A6B61">业务设计核心原则：计划不是已吃，自选草稿不直接入库，就餐确认后方记账并触发动态重规划</text>
  </g>

  <!-- Left Column: 4-Step Process Cards -->
  <g transform="translate(60, 115)">
    <!-- Step 1 Card -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="560" height="115" rx="10" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <circle cx="36" cy="36" r="18" fill="#1B4D3E" />
      <text x="36" y="42" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">1</text>
      <text x="70" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#1B4D3E">建档立标：身体指标与预算约束</text>
      <rect x="360" y="16" width="180" height="22" rx="4" fill="#E8F1EB" />
      <text x="372" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#2E7D5B">动态计算DRIs能量基准</text>
      <text x="70" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#1F2923">输入身高体重与活动系数，自动推导全天热量与三大营养素分配区间；</text>
      <text x="70" y="80" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#5A6B61">设置早、中、晚单餐硬性预算上限（如午餐≤¥25），作为算法强剪枝约束。</text>
    </g>

    <!-- Step 2 Card -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="560" height="115" rx="10" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <circle cx="36" cy="36" r="18" fill="#2E7D5B" />
      <text x="36" y="42" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">2</text>
      <text x="70" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#1B4D3E">双模选餐：算法智能规划 / 自由搭配</text>
      <rect x="380" y="16" width="160" height="22" rx="4" fill="#E8F1EB" />
      <text x="392" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#2E7D5B">支持三算法自由切换</text>
      <text x="70" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#1F2923">推荐模式：调用C++内核按选定算法生成三餐最优组合方案；</text>
      <text x="70" y="80" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#5A6B61">自选模式：支持麻辣烫称重（按3.76元/100g费率）、单品换菜，实时核算热量。</text>
    </g>

    <!-- Step 3 Card -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="560" height="115" rx="10" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <circle cx="36" cy="36" r="18" fill="#E87A24" />
      <text x="36" y="42" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">3</text>
      <text x="70" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#1B4D3E">就餐确认：计划与记账严格解耦</text>
      <rect x="390" y="16" width="150" height="22" rx="4" fill="#FEF3EB" />
      <text x="402" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#E87A24">状态原子转换机</text>
      <text x="70" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#1F2923">用户在食堂真实就餐后点击“确认已吃”，当前计划才转为正式历史记录；</text>
      <text x="70" y="80" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#5A6B61">实际摄入热量与开销从当日总额扣减，触发剩余餐次计划动态重估。</text>
    </g>

    <!-- Step 4 Card -->
    <g transform="translate(0, 390)">
      <rect x="0" y="0" width="560" height="115" rx="10" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <circle cx="36" cy="36" r="18" fill="#1B4D3E" />
      <text x="36" y="42" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">4</text>
      <text x="70" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" font-weight="bold" fill="#1B4D3E">月历追溯：62日时间桶平滑回看</text>
      <rect x="380" y="16" width="160" height="22" rx="4" fill="#E8F1EB" />
      <text x="392" y="32" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="11" font-weight="bold" fill="#2E7D5B">本地离线加密存储</text>
      <text x="70" y="58" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#1F2923">采用62日时间桶分区存储机制，支持跨月份日历打卡与营养汇总统计；</text>
      <text x="70" y="80" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="13" fill="#5A6B61">数据持久化于微信本地Storage，支持JSON安全导出与灾备恢复。</text>
    </g>
  </g>

  <!-- Right Column: 2 Mockup Screenshots -->
  <g transform="translate(660, 115)">
    <!-- Screenshot 1: 自选页面 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="490" rx="14" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <clipPath id="phoneClipP02A">
        <rect x="8" y="8" width="244" height="440" rx="10" />
      </clipPath>
      <image href="images/screenshot-selfpick.png" x="8" y="8" width="244" height="440" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClipP02A)" />
      <text x="130" y="475" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1B4D3E">麻辣烫称重自选界面 (¥11.28)</text>
    </g>

    <!-- Screenshot 2: 就餐记录与回看页面 -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="260" height="490" rx="14" fill="#FFFFFF" stroke="#DDE5DF" stroke-width="1.5" />
      <clipPath id="phoneClipP02B">
        <rect x="8" y="8" width="244" height="440" rx="10" />
      </clipPath>
      <image href="images/screenshot-logs.png" x="8" y="8" width="244" height="440" preserveAspectRatio="xMidYMid slice" clip-path="url(#phoneClipP02B)" />
      <text x="130" y="475" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1B4D3E">确认就餐后日志回看界面</text>
    </g>

    <!-- Bottom Caption -->
    <text x="275" y="525" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#5A6B61">截图来源：user-v5 候选微信开发者工具真实走查场景</text>
  </g>
</svg>
