ackground:linear-gradient(90deg,#f5f6f8 50%,#111416 50%)}.theme-swatch.system:after{background:linear-gradient(90deg,#fff 50%,#2a3235 50%)}.option-leading{display:flex;align-items:center;gap:12px}.back{display:flex;gap:6px;align-items:center;min-height:32px;margin:-13px 0 12px;padding:0;color:var(--muted);background:none;font-size:13px}.log-card{padding:19px 20px}.log-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.log-top h3{font-size:16px;margin:0;font-weight:550}.log-state{font-size:12px;color:var(--accent);background:var(--accent-soft);padding:4px 9px;border-radius:12px}.log-state.empty{color:var(--muted);background:var(--secondary)}.log-food{font-size:15px;line-height:1.7;margin:0 0 5px}.log-meta{font-size:12px;color:var(--muted);display:flex;gap:13px;margin-top:6px}.log-action{margin-top:14px;min-height:38px;border-radius:20px;padding:8px 16px;background:var(--secondary);color:var(--text);font-size:13px}.section-note{font-size:12px;color:var(--muted);line-height:1.8;margin:12px 5px}.overlay{position:absolute;inset:0;background:rgba(9,18,14,.25);z-index:10;display:flex;align-items:flex-end;backdrop-filter:blur(3px)}.sheet{background:var(--surface);border:1px solid var(--highlight);border-radius:30px 30px 0 0;padding:12px 23px 34px;width:100%;max-height:82%;overflow:auto;box-shadow:0 -10px 45px #0001}.handle{width:34px;height:4px;border-radius:3px;background:var(--muted);opacity:.25;margin:0 auto 20px}.sheet h3{font-size:21px;line-height:1.5;margin:0 0 12px;font-weight:600}.sheet p{font-size:14px;line-height:1.85;margin:8px 0;color:var(--muted)}.sheet .button{margin-top:18px;width:100%;min-height:46px}.detail-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.detail-row input{width:80px;background:var(--secondary);border:0;color:var(--text);border-radius:9px;padding:8px;text-align:right}.toast{position:absolute;left:25px;right:25px;bot .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px 4px 14px}.calendar-toolbar button{font-size:12px}.calendar-card{padding:17px 15px}.month-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.month-head strong{font-size:15px;font-weight:550}.month-arrow{background:var(--secondary);color:var(--text);border-radius:50%;width:34px;height:34px;font-size:18px}.weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.weekdays span{font-size:11px;color:var(--muted);text-align:center;padding:6px 0}.day{height:36px;position:relative;border-radius:13px;font-size:13px;background:none;color:var(--text)}.day.active{background:var(--accent);color:var(--btn-text);font-weight:550}.day.has-log:after{content:"";position:absolute;bottom:4px;left:calc(50% - 1.5px);width:3px;height:3px;background:var(--accent);border-radius:50%}.day.active:after{background:var(--btn-text)}.day.is-today:not(.active){box-shadow:inset 0 0 0 1px var(--accent)}.month-summary{border-top:1px solid var(--line);padding-top:13px;margin-top:12px}.month-summary h3{font-size:13px;font-weight:550;margin:0 0 7px}.month-summary p{font-size:12px;color:var(--muted);line-height:1.7;margin:3px 0}

<body>
<header class="review"><div><h1>天科食客 · 更轻一点，更清楚一点。</h1><p>界面设计预览 P01-v2 · 可以切换底部页面、显示模式和外观</p></div><div class="review-label">柔光玻璃 / 清晰字级 / 浅深双主题</div></header>
<main class="board">
<section class="column" data-panel="a"><div class="caption">01 / 日常，简单看<span>首次默认：浅色 + 简易</span></div><div id="phone-a" class="device" aria-label="左侧界面预览"></div><div class="controls"><select aria-label="左侧显示模式" data-panel="a" data-setting="mode"><option value="simple">简易模式</option><option value="full">完整模式</option></select><select aria-label="左侧外观" data-panel="a" data-setting="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></div></section>
<section class="column" data-panel="b"><div class="caption">02 / 营养，细一点<span>对照示意：深色 + 完整</span></div><div id="phone-b" class="device" aria-label="右侧界面预览"></div><div class="controls"><select aria-label="右侧显示模式" data-panel="b" data-setting="mode"><option value="simple">简易模式</option><option value="full">完整模式</option></select><select aria-label="右侧外观" data-panel="b" data-setting="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></div></section>
</main>
<p class="review-foot">独立视觉演示 · 菜单、价格、热量和记录均为虚构样例，不连接小程序，不保存真实记餐。<br>右侧初始深色用于对照；正式产品首次进入默认浅色与简易。窄屏可横向查看另一版。</p>
<script>
'use strict';
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',record:'<rect x="5" y="4" width="14" height="17" rx="3"/><path d="M9 3v3m6-3v3M9 11h6m-6 4h6"/>',user:'<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',leaf:'<path d="M20 4C8 2 2 8 6 16s16 3 14-12Z"/><path d="M4 21 16 9"/>',wallet:'<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M16 11h5v5h-5a2.5 2.5 0 0 1 0-5Z"/>',sun:'<circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/>',data:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>'};
const icon=(name,size=21)=>`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.leaf}</svg>`;
const bowl='<svg class="bowl" viewBox="0 0 80 80" fill="none" aria-hidden="true"><ellipse cx="40" cy="63" rx="25" ry="5" fill="currentColor" opacity=".07"/><path d="M12 37h56c-2 17-11 27-28 27S14 54 12 37Z" fill="currentColor" opacity=".12"/><path d="M13 37h54c-2 16-11 25-27 25S15 53 13 37Z" stroke="currentColor" stroke-width="1.5"/><path d="M20 34c-1-9 7-15 15-10m-6 8c-1-14 14-17 19-7m-5 8c2-11 15-12 19-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="m49 18 11-9m-6 13L68 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
const media=window.matchMedia('(prefers-color-scheme: dark)');
const states={};
for(const id of ['a','b']){let saved=null;try{saved=JSON.parse(localStorage.getItem('tk-ui-review-v2-'+id))}catch{}states[id]={page:'home',meal:'lunch',mode:id==='a'?'simple':'full',theme:id==='a'?'light':'dark',calendarOpen:false,recordDate:'2026-10-20',year:2026,month:10};if(saved&&['simple','full'].includes(saved.mode)&&['light','dark','system'].includes(saved.theme))Object.assign(states[id],{mode:saved.mode,theme:saved.theme});}
const themeName={light:'浅色',dark:'深色',system:'跟随系统'};
const mealName={breakfast:'早餐',lunch:'午餐',dinner:'晚餐'};
const recipes={breakfast:{dish:'鸡蛋、豆浆、全麦面包',price:'6',energy:350,window:'一楼 · 早餐档',composition:'主食、蛋白质食物都有',logged:true},lunch:{dish:'香煎鸡腿、清炒时蔬、米饭',price:'13',energy:600,window:'二楼 · 家常菜',composition:'主食、蛋白质食物、蔬菜都有'},dinner:{dish:'清蒸鱼、菌菇青菜、米饭',price:'15',energy:600,window:'二楼 · 蒸菜档',composition:'主食、蛋白质食物、蔬菜都有'}};
function title(text,sub,extra=''){return `<div class="page-title"><div><h2>${text}</h2><div class="date">${sub}</div></div>${extra}</div>`}
function macro(p=30,f=20,c=75){const sum=4*p+9*f+4*c,vals=[4*p,9*f,4*c],units=vals.map(v=>Math.floor(v/sum*1000));let missing=1000-units.reduce((a,b)=>a+b,0);const rank=vals.map((v,i)=>({i,r:v/sum*1000-units[i]})).sort((a,b)=>b.r-a.r||a.i-b.i);for(let i=0;i<missing;i++)units[rank[i].i]++;const perc=units.map(v=>(v/10).toFixed(1).replace('.0',''));return `<div class="nutrition"><h3>这餐的营养</h3>${['蛋白质','脂肪','碳水'].map((n,i)=>`<div class="nutri-row"><span class="nutri-label"><i class="dot ${['','f','c'][i]}"></i>${n}</span><span>${[p,f,c][i]} 克</span><span>${perc[i]}%</span></div>`).join('')}<div class="macro-bar">${units.map(v=>`<span style="width:${v/10}%"></span>`).join('')}</div><div class="bar-caption">热量来源</div></div>`}
function home(s){const r=recipes[s.meal];return title('天科食客','10月20日 周二',`<button class="mode-pill" data-action="toggle-mode" aria-label="切换显示模式">${s.mode==='simple'?'简易':'完整'} <span>⌄</span></button>`)+`<div class="meal-tabs">${Object.entries(mealName).map(([k,v])=>`<button class="meal-tab ${s.meal===k?'active':''}" data-action="meal" data-value="${k}">${v}${k==='breakfast'?'<i class="tiny-dot"></i>':''}</button>`).join('')}</div><article class="card"><div class="meal-head"><strong>${mealName[s.meal]}</strong><span class="window">${r.window}</span></div><div class="food-top"><p class="food-title">${r.dish}</p><div class="price">¥${r.price}<small>计划花费</small></div>${bowl}</div><div class="energy"><span class="approx">约</span><span class="number">${r.energy}</span><span class="unit">千卡</span></div><div class="composition">${r.composition}</div><div class="estimate">营养为估算值</div>${s.mode==='full'?(s.meal==='breakfast'?macro(20,10,45):macro()):''}<div class="actions"><button class="button secondary" data-action="swap">换一份</button><button class="button main" data-action="${r.logged?'record-view':'confirm'}">${r.logged?'查看记录':'确认吃了'}</button></div><div class="below-actions"><button class="text-button accent" data-action="pick">自己选菜</button><button class="text-button" data-action="detail">这餐详情 ›</button></div></article><article class="card summary"><div><h3>今天已记 <span class="summary-number">1 餐</span></h3><p>已花 ¥6 · 约 350 千卡</p></div><button class="text-button" data-action="summary" aria-label="查看今日小结">查看 ›</button></article><div class="sample">示例菜单 · 仅供界面预览</div>`}
const sampleLogs={'2026-10-18':{lunch:recipes.lunch},'2026-10-19':{breakfast:recipes.breakfast,dinner:recipes.dinner},'2026-10-20':{breakfast:recipes.breakfast}};
const dateKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function calendarView(s){const days=new Date(s.year,s.month,0).getDate(),start=(new Date(s.year,s.month-1,1).getDay()+6)%7,prefix=`${s.year}-${String(s.month).padStart(2,'0')}-`;const entries=Object.entries(sampleLogs).filter(([k])=>k.startsWith(prefix)),all=entries.flatMap(([,v])=>Object.values(v)),spend=all.reduce((a,r)=>a+Number(r.price),0),energy=all.reduce((a,r)=>a+r.energy,0);return `<article class="card calendar-card"><div class="month-head"><button class="month-arrow" data-action="record-month" data-value="-1" aria-label="上个月">‹</button><strong>${s.year}年${s.month}月</strong><button class="month-arrow" data-action="record-month" data-value="1" aria-label="下个月">›</button></div><div class="weekdays">${['一','二','三','四','五','六','日'].map(v=>`<span>${v}</span>`).join('')}</div><div class="calendar-grid">${'<span></span>'.repeat(start)}${Array.from({length:days},(_,i)=>{const k=dateKey(s.year,s.month,i+1);return `<button class="day ${k===s.recordDate?'active':''} ${sampleLogs[k]?'has-log':''} ${k==='2026-10-20'?'is-today':''}" data-action="record-date" data-value="${k}" aria-label="${s.month}月${i+1}日${sampleLogs[k]?'，有记录':''}" aria-pressed="${k===s.recordDate}">${i+1}</button>`}).join('')}</div><div class="month-summary"><h3>本月已记 ${entries.length} 天 · ${all.length} 餐</h3><p>${all.length?`已记录花费 ¥${spend} · 约 ${energy} 千卡`:'这个月还没有记录'}</p><p>仅统计已记录食物 · 空白日期不代表没吃</p></div></article>`}
function logs(s){const [y,m,d]=s.recordDate.split('-').map(Number),week=['周日','周一','周二','周三','周四','周五','周六'][new Date(y,m-1,d).getDay()],dayLogs=sampleLogs[s.recordDate]||{};return title('记录',`${m}月${d}日 ${week}`,`<button class="mode-pill" data-action="record-today">回到今天</button>`)+`<div class="calendar-toolbar"><button class="text-button accent" data-action="record-calendar">${s.calendarOpen?'收起月历 ⌃':'查看月历 ⌄'}</button><span class="muted">${s.recordDate==='2026-10-19'?'昨天的记录':s.recordDate==='2026-10-20'?'今天的记录':`${m}月${d}日的记录`}</span></div>${s.calendarOpen?calendarView(s):''}${Object.entries(mealName).map(([k,n])=>{const r=dayLogs[k];return `<article class="card log-card"><div class="log-top"><h3>${n}</h3><span class="log-state ${r?'':'empty'}">${r?'已记录':'未记录'}</span></div>${r?`<p class="log-food">${r.dish}</p><div class="log-meta"><span>实付 ¥${r.price}</span><span>约 ${r.energy} 千卡</span></div>${s.mode==='full'?`<div class="log-meta"><span>蛋白质 ${k==='breakfast'?20:30} 克</span><span>脂肪 ${k==='breakfast'?10:20} 克</span><span>碳水 ${k==='breakfast'?45:75} 克</span></div>`:''}<button class="text-button accent" data-action="record-detail" data-value="${k}">查看与编辑 ›</button>`:'<p class="muted">这餐还没有记录。</p><button class="log-action" data-action="manual">补记食物</button>'}</article>`}).join('')}<p class="section-note">这里展示虚构记录样例。正式版本只统计已记录食物，推荐搭配不会自动算作已吃。</p>`}
function listRow(name,ico,action,end=''){return `<button class="list-row" data-action="${action}"><span class="row-leading">${icon(ico)}${name}</span><span class="row-end">${end}<span class="arrow">›</span></span></button>`}
function mine(s){return title('我的','按自己的习惯，吃好每一餐。')+`<article class="card profile-card"><div class="profile-icon">${icon('leaf',26)}</div><div><h3>均衡饮食</h3><p>当前饮食目标</p></div></article><div class="group-label">日常设置</div><div class="card list-card">${listRow('个人资料','user','profile')}${listRow('预算与偏好','wallet','budget')}${listRow('显示与外观','sun','settings',s.mode==='simple'?'简易':'完整')}</div><div class="group-label">菜单与数据</div><div class="card list-card">${listRow('数据管理','data','data')}</div><p class="section-note">界面可以简单一点，也可以多看一点。<br>你的用餐记录始终是同一份。</p>`}
function settings(s){return `<button class="back" data-action="back-mine">‹ 返回我的</button>`+title('显示与外观','找到适合你的样子。')+`<div class="group-label">显示模式</div><div class="option-list">${[['simple','简易','先看这顿怎么吃'],['full','完整','多看营养数值']].map(([v,n,d])=>`<button class="option ${s.mode===v?'selected':''}" data-action="mode" data-value="${v}" aria-pressed="${s.mode===v}"><span><strong>${n}</strong><small>${d}</small></span><i class="check">${s.mode===v?'✓':''}</i></button>`).join('')}</div><div class="group-label">外观</div><div class="option-list">${Object.entries(themeName).map(([v,n])=>`<button class="option ${s.theme===v?'selected':''}" data-action="theme" data-value="${v}" aria-pressed="${s.theme===v}"><span class="option-leading"><span class="theme-swatch ${v==='light'?'':v}"></span><span><strong>${n}</strong>${v==='system'?'<small>随系统自动切换浅色与深色</small>':''}</span></span><i class="check">${s.theme===v?'✓':''}</i></button>`).join('')}</div><p class="section-note">显示模式与外观独立设置，不会改变你的用餐记录。</p>`}
function render(id){const s=states[id],el=document.getElementById('phone-'+id);el.dataset.resolved=s.theme==='system'?(media.matches?'dark':'light'):s.theme;const page=s.page==='home'?home(s):s.page==='logs'?logs(s):s.page==='settings'?settings(s):mine(s);el.innerHTML=`<div class="status"><span>12:00</span><span class="status-icons">▴▴ ${icon('sun',12)} ▰</span></div><span class="camera"></span><div class="capsule" aria-hidden="true"><span>•••</span><i></i><b>⊙</b></div><div class="content">${page}</div><nav class="bottom-nav" aria-label="${id==='a'?'左侧':'右侧'}主导航">${[['home','今日'],['logs','记录'],['mine','我的']].map(([p,n])=>`<button class="nav-button ${(s.page===p||(p==='mine'&&s.page==='settings'))?'active':''}" data-action="nav" data-value="${p}">${icon(p==='home'?'home':p==='logs'?'record':'user')}<span>${n}</span></button>`).join('')}</nav><div class="home-indicator"></div>`;document.querySelector(`select[data-panel="${id}"][data-setting="mode"]`).value=s.mode;document.querySelector(`select[data-panel="${id}"][data-setting="theme"]`).value=s.theme;}
function persist(id){try{localStorage.setItem('tk-ui-review-v2-'+id,JSON.stringify({mode:states[id].mode,theme:states[id].theme}));return true}catch{return false}}
function setPreference(id,key,value){const old=states[id][key];states[id][key]=value;if(!persist(id)){states[id][key]=old;render(id);toast(id,'设置没保存，请重试');return}render(id)}
const toastTimers={};
function toast(id,text){const el=document.getElementById('phone-'+id);el.querySelector('.toast')?.remove();const node=document.createElement('div');node.className='toast';node.setAttribute('role','status');node.textContent=text;el.appendChild(node);clearTimeout(toastTimers[id]);toastTimers[id]=setTimeout(()=>node.remove(),2600)}
function sheet(id,heading,body,button='知道了',action='close-sheet'){const el=document.getElementById('phone-'+id);el.querySelector('.overlay')?.remove();const node=document.createElement('div');node.className='overlay';node.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${heading}"><div class="handle"></div><h3>${heading}</h3>${body}<button class="button main" data-action="${action}">${button}</button>${action!=='close-sheet'?'<button class="text-button" data-action="close-sheet" style="width:100%;margin-top:10px">取消</button>':''}</section>`;el.appendChild(node);node.querySelector('button')?.focus()}
function act(id,action,value){const s=states[id],el=document.getElementById('phone-'+id);if(action==='nav'){s.page=value;render(id);return}if(action==='toggle-mode'){setPreference(id,'mode',s.mode==='simple'?'full':'simple');return}if(action==='mode'||action==='theme'){setPreference(id,action,value);return}if(action==='meal'){s.meal=value;render(id);return}if(action==='settings'||action==='back-mine'){s.page=action==='settings'?'settings':'mine';render(id);return}if(action==='close-sheet'){el.querySelector('.overlay')?.remove();return}if(action==='confirm'){const r=recipes[s.meal];sheet(id,'确认这餐吃了',`<p>${r.dish}</p><div class="detail-row"><span>餐次</span><span>${mealName[s.meal]}</span></div><div class="detail-row"><span>实际花费（元）</span><input aria-label="实际花费（元）" type="number" min="0" step="0.01" value="${r.price}"></div><p>可在正式版本调整份量或将花费标记为未知。</p>`,'确认保存（演示）','demo-save');return}if(action==='demo-save'){el.querySelector('.overlay')?.remove();toast(id,'这是界面演示，没有保存真实记录');return}if(action==='detail'){sheet(id,'这餐详情',`<p>${recipes[s.meal].dish} · ${recipes[s.meal].window}</p>${s.meal==='breakfast'?macro(20,10,45):macro()}<p>比例按三种营养的换算热量计算，可能与标注总热量略有差别。</p><div class="detail-row"><span>窗口与菜品锁定</span><span>未锁定 ›</span></div><div class="detail-row"><span>售罄与供应</span><span>查看 ›</span></div><p>本预览采用虚构估算数据，仅展示布局。</p>`);return}if(action==='summary'){sheet(id,'今日小结','<div class="budget-line"><span>已记录</span><strong>1 餐 · 约 350 千卡</strong></div><div class="budget-line"><span>已花</span><strong>¥6</strong></div><div class="budget-line"><span>待吃计划</span><strong>午餐 ¥13 / 晚餐 ¥15</strong></div><p>没有设置全天预算。计划与已吃分别统计。</p>');return}if(action==='record-view'||action==='edit-record'){sheet(id,'早餐记录','<p>鸡蛋、豆浆、全麦面包</p><div class="detail-row"><span>实付</span><span>¥6</span></div><p>正式版本可编辑、撤销或补记，这里仅展示页面层级。</p>');return}if(action==='data'){sheet(id,'数据管理',`<p>当前：示例菜单 · 用于设计演示</p>${listRow('更新菜单','data','demo-data')}${listRow('导出备份','record','demo-data')}${listRow('恢复备份','data','demo-data')}<p>高级信息与开发诊断放在次级页面。</p>`);return}const copy={swap:['换一份','正式版本会按当前锁定、供应和预算条件换餐。本预览只演示界面，不调用算法。'],pick:['自己选菜','这里进入当前餐次的菜品列表，查看窗口、菜品、价格和份量，再确认选择。'],manual:['补记食物','正式版本展开食物、份量、实付及已知营养输入；未知数据不按零处理。'],profile:['个人资料','已有资料先展示，点编辑后再填表。身体资料与手动目标不会平铺在首页。'],budget:['预算与偏好','全天预算、口味偏好和训练偏好在这里分别设置。'],calendar:['选择日期','正式版本可切换记录日期；切主题或显示模式不会改变已选日期。'],'demo-data':['数据操作','视觉演示不会选择文件、导出或覆盖你的真实数据。']};if(copy[action])sheet(id,...copy[action]);}
function recordAction(id,action,value){const s=states[id];if(action==='record-calendar')s.calendarOpen=!s.calendarOpen;else if(action==='record-date'){s.recordDate=value;const [y,m]=value.split('-').map(Number);s.year=y;s.month=m;}else if(action==='record-today'){s.recordDate='2026-10-20';s.year=2026;s.month=10;}else if(action==='record-month'){const next=new Date(s.year,s.month-1+Number(value),1),day=Math.min(Number(s.recordDate.slice(-2)),new Date(next.getFullYear(),next.getMonth()+1,0).getDate());s.year=next.getFullYear();s.month=next.getMonth()+1;s.recordDate=dateKey(s.year,s.month,day);}else if(action==='record-detail'){const r=sampleLogs[s.recordDate]?.[value];if(r)sheet(id,`${s.recordDate} · ${mealName[value]}`,`<p>${r.dish}</p><div class="detail-row"><span>实付</span><span>¥${r.price}</span></div><div class="detail-row"><span>热量</span><span>约 ${r.energy} 千卡</span></div><p>演示数据；实际接合时读取该天原始记录快照，保留编辑、撤销和补记入口。</p>`);return true;}else return false;render(id);return true;}
for(const id of ['a','b']){document.getElementById('phone-'+id).addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(b){if(!recordAction(id,b.dataset.action,b.dataset.value))act(id,b.dataset.action,b.dataset.value);}else if(event.target.classList.contains('overlay'))event.target.remove()});document.getElementById('phone-'+id).addEventListener('keydown',event=>{if(event.key==='Escape')document.getElementById('phone-'+id).querySelector('.overlay')?.remove()});render(id)}
document.querySelectorAll('select[data-setting]').forEach(select=>select.addEventListener('change',()=>setPreference(select.dataset.panel,select.dataset.setting,select.value)));
media.addEventListener('change',()=>{for(const id of ['a','b'])if(states[id].theme==='system')document.getElementById('phone-'+id).dataset.resolved=media.matches?'dark':'light'});
</script>
</body>
</html>
